name: Remote Master Builder

on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'Source Branch/Tag (from wangn9900/Slux)'
        required: true
        default: 'main'
      build_android:
        description: 'Build Android?'
        type: boolean
        default: true
      build_windows:
        description: 'Build Windows?'
        type: boolean
        default: true
      build_macos:
        description: 'Build macOS?'
        type: boolean
        default: true
      upload_release:
        description: 'Upload to Release (tianquege)?'
        type: boolean
        default: true

jobs:
  # =================================================================================================
  # 1. Android Build Job
  # =================================================================================================
  build-android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from wangn9900
        uses: actions/checkout@v4
        with:
          repository: wangn9900/Slux
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
          add-to-path: true

      - name: Initialize Go module
        working-directory: core/mobile
        run: |
          rm -f go.mod go.sum
          go mod init libcore
          go get golang.org/x/mobile@latest
          go get github.com/sagernet/sing-box@v1.12.15
          go mod tidy

      - name: Setup Gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "GOBIND=$(go env GOPATH)/bin/gobind" >> $GITHUB_ENV
          gomobile init

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Android Keystore
        id: android_keystore
        uses: timheuer/base64-to-file@v1.2
        with:
          fileName: upload-keystore.jks
          encodedString: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

      - name: Create key.properties
        run: |
          echo "storeFile=${{ steps.android_keystore.outputs.filePath }}" > android/key.properties
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" >> android/key.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" >> android/key.properties

      - name: Generate app icons
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          SOURCE_ICON="assets/app_icon.png"
          ANDROID_PATH="android/app/src/main/res"
          mkdir -p "$ANDROID_PATH/mipmap-mdpi"
          mkdir -p "$ANDROID_PATH/mipmap-hdpi"
          mkdir -p "$ANDROID_PATH/mipmap-xhdpi"
          mkdir -p "$ANDROID_PATH/mipmap-xxhdpi"
          mkdir -p "$ANDROID_PATH/mipmap-xxxhdpi"
          convert "$SOURCE_ICON" -resize 48x48 "$ANDROID_PATH/mipmap-mdpi/ic_launcher.png"
          convert "$SOURCE_ICON" -resize 72x72 "$ANDROID_PATH/mipmap-hdpi/ic_launcher.png"
          convert "$SOURCE_ICON" -resize 96x96 "$ANDROID_PATH/mipmap-xhdpi/ic_launcher.png"
          convert "$SOURCE_ICON" -resize 144x144 "$ANDROID_PATH/mipmap-xxhdpi/ic_launcher.png"
          convert "$SOURCE_ICON" -resize 192x192 "$ANDROID_PATH/mipmap-xxxhdpi/ic_launcher.png"
          dart run scripts/generate_notification_icon.dart

      - name: Build Android APK
        run: |
          mkdir -p android_dist
          flutter clean
          rm -rf android/app/libs/*
          mkdir -p android/app/libs
          pushd core/mobile
          gomobile bind -v -androidapi 21 -target=android/arm,android/arm64 \
            -ldflags='-s -w -checklinkname=0' \
            -tags='with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' \
            -o ../../android/app/libs/libbox.aar \
            . github.com/sagernet/sing-box/experimental/libbox
          popd
          flutter build apk --release --target-platform android-arm,android-arm64 --split-per-abi
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk android_dist/
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk android_dist/
          
          flutter clean
          rm -rf android/app/libs/*
          mkdir -p android/app/libs
          pushd core/mobile
          gomobile bind -v -androidapi 21 -target=android/386,android/amd64 \
            -ldflags='-s -w -checklinkname=0' \
            -tags='with_conntrack,with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api' \
            -o ../../android/app/libs/libbox.aar \
            . github.com/sagernet/sing-box/experimental/libbox
          popd
          flutter build apk --release --target-platform android-x64
          mv build/app/outputs/flutter-apk/app-release.apk android_dist/app-x86-x64-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slux-android-apks
          path: android_dist/*.apk

  # =================================================================================================
  # 2. Windows Build Job
  # =================================================================================================
  build-windows:
    if: ${{ github.event.inputs.build_windows == 'true' }}
    name: Build Windows App
    runs-on: windows-latest
    steps:
      - name: Checkout code from wangn9900
        uses: actions/checkout@v4
        with:
          repository: wangn9900/Slux
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Download Sing-box core
        run: |
          ./scripts/download_core.ps1 -Platform windows -Force
          New-Item -ItemType Directory -Path "temp_core_backup" -Force
          Copy-Item -Path "assets/core/sing-box.exe" -Destination "temp_core_backup/sing-box.exe" -Force
          Copy-Item -Path "assets/core/wintun.dll" -Destination "temp_core_backup/wintun.dll" -Force -ErrorAction SilentlyContinue
        shell: powershell

      - name: Build Windows App
        run: |
          flutter config --enable-windows-desktop
          flutter clean
          flutter build windows --release

      - name: Package Windows Release
        run: |
          $buildDir = "build\windows\x64\runner\Release"
          Copy-Item -Path "windows/runner/resources/app_icon.ico" -Destination "$buildDir/app_icon.ico"
          New-Item -ItemType Directory -Path "$buildDir/core" -Force
          Copy-Item -Path "temp_core_backup/sing-box.exe" -Destination "$buildDir/core/sing-box.exe" -Force
          Copy-Item -Path "temp_core_backup/wintun.dll" -Destination "$buildDir/core/wintun.dll" -Force -ErrorAction SilentlyContinue
          Compress-Archive -Path "$buildDir\*" -DestinationPath "slux-windows-x64.zip"

      - name: Create Installer using Inno Setup
        run: |
          Copy-Item -Path "windows/runner/resources/app_icon.ico" -Destination "build/windows/x64/runner/Release/app_icon.ico"
          choco install innosetup -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\windows_installer.iss
          Move-Item -Path "build/windows/x64/slux_setup.exe" -Destination "slux_setup.exe"
        shell: powershell

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slux-windows-release
          path: |
            slux-windows-x64.zip
            slux_setup.exe

  # =================================================================================================
  # 3. macOS Build Job
  # =================================================================================================
  build-macos:
    if: ${{ github.event.inputs.build_macos == 'true' }}
    name: Build macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code from wangn9900
        uses: actions/checkout@v4
        with:
          repository: wangn9900/Slux
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Generate app icons
        run: |
          brew install imagemagick
          magick -size 1024x1024 xc:none -fill "gradient:#3B82F6-#8B5CF6" -draw "roundrectangle 0,0 1024,1024 160,160" temp_bg.png
          magick -size 1024x1024 xc:none -fill white -draw "path 'M 554,85 L 128,597 L 512,597 L 469,938 L 896,426 L 512,426 Z'" temp_bolt.png
          magick composite -gravity center temp_bolt.png temp_bg.png temp_icon.png
          cp temp_icon.png ui/logo.png
          magick convert temp_icon.png -resize 1024x1024 macos/Runner/Assets.xcassets/AppIcon.appiconset/app_icon_1024.png
          rm temp_bg.png temp_bolt.png temp_icon.png

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.13'

      - name: Compile Sing-box ARM64 & Merge
        run: |
          mkdir -p assets/core
          SING_BOX_TAG="v1.12.15"
          git clone --depth 1 --branch ${SING_BOX_TAG} https://github.com/SagerNet/sing-box.git source_code
          cd source_code
          TAGS="with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api,netgo,osusergo"
          LDFLAGS="-s -w -X github.com/sagernet/sing-box/constant.Version=${SING_BOX_TAG}"
          export CGO_ENABLED=0
          export GOOS=darwin
          export GOARCH=arm64
          export MACOSX_DEPLOYMENT_TARGET=10.13
          go build -tags "$TAGS" -trimpath -ldflags "$LDFLAGS" -o ../sing-box-arm64 ./cmd/sing-box
          cd ..
          lipo -create -output assets/core/sing-box macos/sing-box ./sing-box-arm64
          chmod +x assets/core/sing-box
          rm -rf source_code sing-box-arm64

      - name: Build macOS Release
        run: flutter build macos --release

      - name: Inject Tray Icon
        run: cp ui/logo.png build/macos/Build/Products/Release/slux.app/Contents/Resources/tray_icon.png

      - name: Ad-hoc Sign
        run: codesign --force --deep --sign - build/macos/Build/Products/Release/slux.app

      - name: Package DMG
        run: |
          brew install create-dmg
          cd build/macos/Build/Products/Release
          mkdir -p dmg_source
          cp -R slux.app dmg_source/
          create-dmg \
            --volname "Slux Installer" \
            "Slux-Installer.dmg" \
            "dmg_source"
          mv Slux-Installer.dmg ../../../../../slux-macos-installer.dmg

      - name: Upload MacOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: slux-macos-release
          path: slux-macos-installer.dmg

  # =================================================================================================
  # 4. Final Release Job
  # =================================================================================================
  publish-release:
    if: ${{ always() && github.event.inputs.upload_release == 'true' }}
    name: Publish All to Public Repo
    needs: [build-android, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code from wangn9900
        uses: actions/checkout@v4
        with:
          repository: wangn9900/Slux
          ref: ${{ github.event.inputs.branch }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Extract Version
        id: extract_version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release_artifacts

      - name: Update Public Repo Documentation
        run: |
          git config --global user.name "Slux Bot"
          git config --global user.email "bot@slux.dev"
          git clone https://${{ secrets.PUBLIC_REPO_TOKEN }}@github.com/tianquege/Slux-tianque.git public_repo
          cp docs/MACOS_GUIDE.md public_repo/README.md
          cd public_repo
          if [[ -n $(git status -s) ]]; then
            git add README.md
            git commit -m "Docs: Update README [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish to Public Repository
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          owner: tianquege
          repo: Slux-tianque
          tag: "v${{ env.VERSION }}"
          name: "Slux v${{ env.VERSION }}"
          body: "Automated Remote Release via wxfyes builder."
          artifacts: |
            release_artifacts/slux-android-apks/*.apk
            release_artifacts/slux-windows-release/slux-windows-x64.zip
            release_artifacts/slux-windows-release/slux_setup.exe
            release_artifacts/slux-macos-release/slux-macos-installer.dmg
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
